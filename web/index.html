<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thermal Master Viewer</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <img id="logo" src="icon.svg" alt="" width="22" height="22">
  <h1>Thermal Master Viewer <span id="modelName"></span></h1>
  <span id="status">connecting</span>
  <label><span class="lbl">Palette</span>
    <select id="palette"></select>
  </label>
  <label><span class="lbl">Source</span>
    <select id="source">
      <option value="thermal">Thermal</option>
      <option value="ir">IR brightness</option>
      <option value="blend">Blend</option>
    </select>
  </label>
  <label><span class="lbl">Range</span>
    <select id="rangeMode">
      <option value="auto">Auto</option>
      <option value="rolling">Rolling</option>
      <option value="manual">Manual</option>
    </select>
  </label>
  <label id="manualRange" hidden>
    <input type="number" id="rangeLo" step="1" style="width:58px"> to
    <input type="number" id="rangeHi" step="1" style="width:58px">
  </label>
  <span class="grow"></span>
  <button id="connect">Connect camera</button>
  <button id="rotCCW" class="icon" title="Rotate 90&deg; counter-clockwise"
          aria-label="Rotate counter-clockwise">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 19.5A7.5 7.5 0 1 0 4.5 12" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
      <path d="M2 11h5l-2.5 4.8z" fill="currentColor"/>
    </svg>
  </button>
  <button id="rotCW" class="icon" title="Rotate 90&deg; clockwise"
          aria-label="Rotate clockwise">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 19.5A7.5 7.5 0 1 1 19.5 12" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
      <path d="M17 11h5l-2.5 4.8z" fill="currentColor"/>
    </svg>
  </button>
  <button id="unit">&deg;C</button>
  <button id="freeze">Freeze</button>
  <button id="save" title="Save the image and overlays as a PNG">PNG</button>
  <button id="saveCsv" title="Save every pixel's temperature as a CSV">CSV</button>
</header>

<main>
  <div id="stage">
    <div id="wrap">
      <canvas id="view"></canvas>
      <canvas id="overlay"></canvas>
    </div>
  </div>

  <aside>
    <div class="readout">
      <h2>Cursor</h2>
      <div class="big" id="cursorTemp">--</div>
      <div class="row"><span class="k">Max</span><span class="v hot" id="maxTemp">--</span></div>
      <div class="row"><span class="k">Min</span><span class="v cold" id="minTemp">--</span></div>
      <div class="row"><span class="k">Centre</span><span class="v" id="centreTemp">--</span></div>
      <div class="row"><span class="k">Average</span><span class="v" id="avgTemp">--</span></div>
    </div>

    <div class="stack">
      <h2>Scale</h2>
      <canvas id="scale" width="200" height="13"></canvas>
      <div class="row meta"><span id="scaleLo">--</span><span id="scaleHi">--</span></div>
    </div>

    <div class="stack">
      <h2>Overlays</h2>
      <div class="btns">
        <button id="tMarkers" class="on">Hot/cold</button>
        <button id="tReticle" class="on">Reticle</button>
        <button id="tLabels" class="on">Labels</button>
        <button id="tSmooth">Smooth</button>
      </div>
    </div>

    <div class="stack">
      <h2>Emissivity <span id="emisVal" class="meta"></span></h2>
      <input type="range" id="emis" min="0.10" max="1.00" step="0.01" value="0.95" style="width:100%">
      <div class="meta">Reflected <span id="reflVal"></span></div>
      <input type="range" id="refl" min="-10" max="60" step="1" value="25" style="width:100%">
    </div>

    <div class="stack">
      <h2>Camera</h2>
      <div class="btns">
        <button id="shutter">Shutter</button>
        <button id="gainHigh" class="on">High gain</button>
      </div>
      <div class="meta">High gain: &minus;20 to 150&deg;C. Low: 0 to 550&deg;C.</div>
    </div>

    <div class="stack meta" id="deviceMeta"></div>
  </aside>

  <section id="logPanel">
    <div id="logBar">
      <button id="logToggle" type="button" aria-expanded="false">
        <span id="logChev">&#9656;</span> Firmware log
      </button>
      <span id="logCount" class="meta"></span>
      <span class="grow"></span>
      <button id="logSave" class="mini">Save</button>
      <button id="logClear" class="mini">Clear</button>
    </div>
    <pre id="log" hidden></pre>
  </section>
</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
